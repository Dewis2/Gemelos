name: Code quality

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e "./backend[dev]"
      - run: black --check backend/src backend/tests ml/src ml/tests edge
      - run: ruff check backend/src backend/tests ml/src ml/tests edge

