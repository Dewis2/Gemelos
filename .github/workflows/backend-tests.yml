name: Backend tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e "./backend[dev]"
      - name: Ruff
        run: ruff check backend/src backend/tests ml/src ml/tests edge
      - name: MyPy
        run: mypy backend/src
      - name: Pytest
        run: python -m pytest

