name: Code quality

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e "./backend[dev]"
      - run: black --check backend/src backend/tests ml/src ml/tests edge
      - run: ruff check backend/src backend/tests ml/src ml/tests edge
      - name: PMV2 and PMV3 tools
        run: |
          black --check backend/migrations/versions/0003_traffic_stored_routines.py ml/experiments/peru_toll_traffic/train.py scripts/backup_postgres.py scripts/export_evidence.py scripts/load_test_local.py scripts/validate_local_2026.py simulation/calibration.py
          ruff check backend/migrations/versions/0003_traffic_stored_routines.py ml/experiments/peru_toll_traffic/train.py scripts/backup_postgres.py scripts/export_evidence.py scripts/load_test_local.py scripts/validate_local_2026.py simulation/calibration.py

