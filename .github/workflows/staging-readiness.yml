name: Staging readiness
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Python tooling
        run: python -m pip install -e "./backend[dev]" pyyaml
      - name: Show formatting diff for staging config
        run: black --diff backend/src/infrastructure/config/settings.py || true
      - name: Verify application and staging settings
        run: |
          ruff check backend/src backend/tests ml/src ml/tests edge
          mypy backend/src
          python -m pytest
      - name: Validate Render blueprint syntax and staging values
        run: |
          python - <<'PY'
          import yaml
          with open("render.yaml", encoding="utf-8") as handle:
              blueprint = yaml.safe_load(handle)
          assert len(blueprint["databases"]) == 1
          assert len(blueprint["services"]) == 2
          for service in blueprint["services"]:
              assert service["autoDeployTrigger"] == "checksPass"
          print("Blueprint structure verified; cloud provisioning still required.")
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Verify production frontend with a safe test URL
        env:
          VITE_API_URL: https://api.example.org
        run: |
          cd frontend
          npm ci
          node scripts/check-staging-env.mjs
          npm run test
          npm run build
