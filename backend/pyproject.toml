[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gemelo-digital-huancayo-backend"
version = "0.1.0"
description = "Núcleo hexagonal del gemelo digital de movilidad urbana"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.32,<1",
  "pydantic-settings>=2.6,<3",
  "sqlalchemy>=2.0,<3",
  "geoalchemy2>=0.16,<1",
  "psycopg[binary]>=3.2,<4",
  "alembic>=1.14,<2",
  "paho-mqtt>=2.1,<3",
  "joblib>=1.4,<2",
  "numpy>=2.0,<3",
  "pandas>=2.2,<3",
  "scikit-learn>=1.5,<2",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
  "ruff>=0.8,<1",
  "black>=24.10,<26",
  "mypy>=1.13,<2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/domain", "src/application", "src/adapters", "src/infrastructure"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["migrations"]
